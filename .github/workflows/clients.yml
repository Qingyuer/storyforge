name: Build Windows and Android Clients
on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/desktop/**'
      - 'scripts/distribution/**'
      - 'src/lib/platform/**'
      - 'src/components/settings/ClientUpdatePanel.tsx'
      - 'capacitor.config.json'
      - 'electron-builder.config.cjs'
      - 'package*.json'
      - '.github/workflows/clients.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:clients
      - run: npm run build:windows
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Launch packaged app in an isolated profile
        run: node scripts/desktop/smoke.mjs release/windows/win-unpacked/StoryForge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.yml
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build:android:web
      - name: Build isolated debug APK
        if: ${{ !inputs.release }}
        run: node scripts/distribution/build-android.mjs
      - name: Build with the permanent APK signing key
        if: ${{ inputs.release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/storyforge-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          node scripts/distribution/build-android.mjs --release
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the actual Android WebView and stable storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Preserve Android device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
